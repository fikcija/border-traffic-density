; Three processes in one container:
;   prefect-server  the API and UI on :4200
;   flow-runner     registers the deployment and waits for its schedule
;   api             the FastAPI inference service on :8000
;
; Trade-off to be aware of: Docker sees ONE container, so if a single program dies
; the container still reports healthy. autorestart=true on each program is the
; mitigation; a multi-container split would let Docker supervise them individually.

; The control interface. Without these three sections `supervisorctl` refuses to
; run ("ini file does not include supervisorctl section"), which matters because
; Docker only sees the container as a whole - supervisorctl is the only way to
; inspect or restart an individual process:
;
;   docker compose exec app supervisorctl status
;   docker compose exec app supervisorctl restart api
;   docker compose exec app supervisorctl tail -f flow-runner
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:prefect-server]
command=prefect server start --host 0.0.0.0 --port 4200
directory=/app
autorestart=true
startsecs=5
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0

[program:flow-runner]
; train_flow.py waits for the Prefect API itself before serving the deployment.
command=python src/flows/train_flow.py
directory=/app
autorestart=true
startsecs=10
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0

[program:api]
command=uvicorn app:app --host 0.0.0.0 --port 8000 --app-dir /app/src/serve
directory=/app
autorestart=true
startsecs=5
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_logfile_backups=0
